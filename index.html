<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ff5a5f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="いいね">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <title>いいね</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      background: #f4f7fb;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { text-align: center; width: 100%; }
    h1 { font-size: 30px; margin: 0 0 28px; color: #222; }
    .buttons {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
    }
    button {
      width: min(78vw, 330px);
      height: 145px;
      border: 0;
      border-radius: 36px;
      color: white;
      font-size: clamp(34px, 9vw, 48px);
      font-weight: 800;
      box-shadow: 0 10px 24px rgba(0,0,0,.17);
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    button:active { transform: scale(.96); }
    #likeButton { background: #ff5a5f; }
    #nandeButton { background: #4f73d9; }
    p { margin-top: 26px; font-size: 17px; color: #555; }
  </style>
</head>
<body>
  <main>
    <h1>いいねアプリ</h1>
    <div class="buttons">
      <button id="likeButton">いいね</button>
      <button id="nandeButton">なんでやねん</button>
    </div>
    <p>ボタンを押すとしゃべります</p>
  </main>

  <script>
    function speak(text, rate, pitch) {
      if (!('speechSynthesis' in window)) {
        alert('この端末では音声読み上げに対応していません。');
        return;
      }
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'ja-JP';
      u.rate = rate;
      u.pitch = pitch;
      u.volume = 1.0;
      speechSynthesis.speak(u);
    }

    document.getElementById('likeButton').addEventListener('click', () => {
      speak('いいねぇー', 1.22, 1.18);
    });

    document.getElementById('nandeButton').addEventListener('click', () => {
      speak('なんでやねん！', 1.24, 1.12);
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
