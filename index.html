<script>
function getJapaneseVoice() {
  const voices = speechSynthesis.getVoices();
  const ja = voices.filter(v => (v.lang || '').toLowerCase().startsWith('ja'));
  return ja[0] || null;
}

function speak(text, rate, pitch) {
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ja-JP';
  u.rate = rate;
  u.pitch = pitch;
  u.volume = 1;
  const v = getJapaneseVoice();
  if (v) u.voice = v;
  speechSynthesis.speak(u);
}

document.getElementById('likeButton').onclick = () => {
  speak('いいねぇー', 1.10, 1.14);
};

document.getElementById('nandeButton').onclick = () => {
  // 「で」を伸ばさず、一続きで自然に発声
  speak('なんでやねんっ！', 1.08, 1.03);
};

function playAudio(id) {
  const a = document.getElementById(id);
  a.pause();
  a.currentTime = 0;
  a.play().catch(() => {});
}
document.getElementById('correctButton').onclick = () => playAudio('correctAudio');
document.getElementById('wrongButton').onclick = () => playAudio('wrongAudio');

if ('serviceWorker' in navigator) {
  addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}
</script>
